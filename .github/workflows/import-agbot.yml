name: Import Agbot source

on:
  push:
    paths:
      - '.github/workflows/import-agbot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect share page
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://firestorage.ai/ja/f/L2H6TVyP_LIX' -o /tmp/page.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/page.html').read_text(errors='replace')
          print('length', len(s))
          for pat in [r'https?://[^"\'<> ]+', r'/api/[^"\'<> ]+', r'[^"\'<> ]*download[^"\'<> ]*', r'[^"\'<> ]*01a0856fa14d71d48dc5c4be61c4fd30[^"\'<> ]*', r'[^"\'<> ]*5XexhnvgpMitiNOQ[^"\'<> ]*']:
              print('PATTERN', pat)
              vals=[]
              for m in re.findall(pat, s, re.I):
                  if m not in vals:
                      vals.append(m)
              for v in vals[:80]:
                  print(v[:1000])
          PY
