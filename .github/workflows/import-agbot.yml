name: Import Agbot source

on:
  push:
    paths:
      - '.github/workflows/import-agbot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect share page internals
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://firestorage.ai/ja/f/L2H6TVyP_LIX' -o /tmp/page.html
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/page.html').read_text(errors='replace')
          print('length', len(s))
          for needle in ['L2H6TVyP_LIX','FileDownloadPreparing','_next/static','__next_f','download','folder','public','file']:
              print('\n===',needle,'===')
              start=0; count=0
              while count<12:
                  i=s.lower().find(needle.lower(), start)
                  if i<0: break
                  print(s[max(0,i-600):min(len(s),i+1200)].replace('><','>\n<'))
                  start=i+len(needle); count+=1
          PY
