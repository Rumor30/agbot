name: Import Agbot source

on:
  push:
    paths:
      - '.github/workflows/import-agbot.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Firestorage client API
        run: |
          set -euo pipefail
          curl -fL 'https://firestorage.ai/_next/static/chunks/app/%28files%29/ja/f/page-4d19ae0a4ce39d79.js' -o /tmp/page.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/page.js').read_text(errors='replace')
          print('length',len(s))
          vals=[]
          for pat in [r'https?[^"\']+', r'/api/[^"\']+', r'[^"\']{0,100}download[^"\']{0,200}', r'[^"\']{0,100}share[^"\']{0,200}', r'[^"\']{0,100}public[^"\']{0,200}']:
              for x in re.findall(pat,s,re.I):
                  if x not in vals: vals.append(x)
          for x in vals[:200]: print(x[:1500])
          PY
