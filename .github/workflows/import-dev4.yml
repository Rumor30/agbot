name: Import runtime self-heal dev.4

on:
  workflow_dispatch:
  push:
    branches: [computer-v1-20260909]
    paths:
      - '.ci/patch-dev4/READY'
      - 'scripts/apply_dev4.py'

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed dev.4 source transform
        run: python scripts/apply_dev4.py
      - name: Verify source syntax and invariants
        run: |
          python -m py_compile scripts/prepare_android.py scripts/apply_dev4.py
          javac scripts/JavaSyntaxCheck.java
          java -cp scripts JavaSyntaxCheck android-overlay/app/src/main/java/app/agbot/android/LocalComputer.java
          git diff --check
          grep -F 'private void prepareRuntime()' android-overlay/app/src/main/java/app/agbot/android/LocalComputer.java
          grep -F 'bin/netbox' android-overlay/app/src/main/java/app/agbot/android/LocalComputer.java
          grep -F 'ownedDaemonPids' android-overlay/app/src/main/java/app/agbot/android/LocalComputer.java
          grep -F 'versionName = "0.2.0-dev.4"' scripts/prepare_android.py
      - name: Commit coherent runtime fix
        run: |
          git config user.name 'Agbot CI Importer'
          git config user.email 'actions@users.noreply.github.com'
          git add android-overlay/app/src/main/java/app/agbot/android/LocalComputer.java scripts/prepare_android.py
          git diff --cached --quiet && { echo 'runtime fix produced no source changes'; exit 1; }
          git commit -m 'fix(android): self-heal stale DroidVM runtime on update'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Dispatch real checks from imported commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run test.yml --ref "$GITHUB_REF_NAME"
          gh workflow run android.yml --ref "$GITHUB_REF_NAME"
