name: Linux Computer integration
on:
  workflow_dispatch:
  push:
    branches: [main, computer-v1-20260909]
    paths:
      - '.github/workflows/guest-integration.yml'
      - 'guest/**'
      - 'gateway/src/**'
      - 'scripts/guest_smoke.py'
      - 'scripts/run_guest_integration.py'
      - 'scripts/seed_config.py'
      - 'scripts/SeedHarness.java'
      - 'scripts/package_guest.py'
      - 'android-overlay/**/SeedDisk.java'
permissions:
  contents: read
concurrency:
  group: guest-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guest:
    name: Real Linux Guest (${{ matrix.arch }}, not Gunyah)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install VM test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-arm qemu-utils ovmf qemu-efi-aarch64 dosfstools openssl
          if test -e /dev/kvm; then sudo chmod 0666 /dev/kvm; fi
      - name: Boot cloud image, enroll, execute and reboot
        run: python -u scripts/run_guest_integration.py --arch '${{ matrix.arch }}' --output guest-evidence
      - name: Upload sanitized evidence (no seed, token or private key)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: guest-evidence-${{ matrix.arch }}-${{ github.run_number }}
          path: guest-evidence/
          if-no-files-found: warn
          retention-days: 14
