name: Android debug APK (manual)
# Native upstream builds/downloads are intentionally opt-in, not run on every push.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned upstream build prerequisites
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'cmake;3.22.1'
      - name: Fetch locked source, apply Agbot, and compile
        run: python scripts/bootstrap.py --build
      - uses: actions/upload-artifact@v7
        with:
          name: Agbot-0.1.0-dev.1-debug
          path: upstream/DroidVM/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
