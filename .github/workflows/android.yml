name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, computer-v1-20260909]
    paths:
      - '.github/workflows/android.yml'
      - 'android-overlay/**'
      - 'scripts/bootstrap.py'
      - 'scripts/prepare_android.py'
      - 'scripts/package_guest.py'
      - 'scripts/verify_apk.py'
      - 'scripts/smoke_android.py'
      - 'upstream.lock.json'
      - 'gateway/src/**'
      - 'guest/**'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned upstream build prerequisites
        run: |
          mkdir -p build-evidence
          sdkmanager --version | tee build-evidence/sdkmanager-version.txt
          sdkmanager --list > build-evidence/sdk-packages.txt
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'cmake;3.22.1' 2>&1 | tee build-evidence/sdk.log
      - name: Fetch and prepare locked DroidVM
        run: python -u scripts/bootstrap.py 2>&1 | tee build-evidence/preparation.log
      - name: Compile real debug APK
        run: |
          cd upstream/DroidVM
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee ../../build-evidence/gradle.log
      - name: Inspect APK identity, signature and complete runtime
        run: |
          mkdir -p dist
          mapfile -t apks < <(find upstream/DroidVM/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" dist/Agbot-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/Agbot-debug.apk | tee build-evidence/apk-badging.txt
          grep -F "package: name='app.agbot.android'" build-evidence/apk-badging.txt
          grep -F "launchable-activity: name='app.agbot.android.AgbotActivity'" build-evidence/apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree dist/Agbot-debug.apk AndroidManifest.xml > build-evidence/apk-manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/Agbot-debug.apk | tee build-evidence/apk-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c 4 dist/Agbot-debug.apk
          python scripts/verify_apk.py dist/Agbot-debug.apk --output build-evidence/apk-contents.json
          (cd dist && sha256sum Agbot-debug.apk > SHA256SUMS)
          unzip -l dist/Agbot-debug.apk > build-evidence/apk-entries.txt
          cp build-evidence/apk-badging.txt build-evidence/apk-signature.txt build-evidence/apk-contents.json dist/
          printf 'APK built, signature checked, and packaged Guest/native assets verified. Gunyah boot and model login remain untested.\n' >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Record exact source provenance
        if: always()
        run: |
          mkdir -p build-evidence
          git rev-parse HEAD > build-evidence/agbot-commit.txt
          cp upstream.lock.json build-evidence/
          if test -e upstream/DroidVM/.git; then
            git -C upstream/DroidVM rev-parse HEAD > build-evidence/droidvm-commit.txt
            git -C upstream/DroidVM submodule status --recursive > build-evidence/submodules.txt
            git -C upstream/DroidVM diff --stat > build-evidence/overlay-diff-stat.txt
          fi
      - name: Upload verified APK
        uses: actions/upload-artifact@v7
        with:
          name: Agbot-debug-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-evidence-${{ github.run_number }}
          path: build-evidence/
          if-no-files-found: warn
          retention-days: 30

  ui-smoke:
    name: Android 16 UI smoke (not a Gunyah test)
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: Agbot-debug-${{ github.run_number }}
          path: dist
      - name: Verify downloaded APK checksum
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Enable emulator acceleration on disposable CI host
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Install APK and navigate UI without model credentials
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python scripts/smoke_android.py dist/Agbot-debug.apk --output smoke-evidence
      - name: Upload UI screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-smoke-${{ github.run_number }}
          path: smoke-evidence/
          if-no-files-found: warn
          retention-days: 30
