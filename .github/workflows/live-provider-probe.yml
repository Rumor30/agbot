name: Authorized live provider probe
on:
  workflow_dispatch:
  push:
    branches: [computer-v1-20260909]
    paths: ['.github/workflows/live-provider-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create disposable encryption key (private half never uploaded)
        run: |
          python -m pip install --quiet cryptography
          python - <<'PY'
          import os, json, secrets, hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          os.umask(0o077)
          key=rsa.generate_private_key(public_exponent=65537,key_size=3072)
          private=Path(os.environ['RUNNER_TEMP'])/'agbot-probe-private.pem'
          private.write_bytes(key.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()))
          public=key.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo)
          Path('probe-public').mkdir()
          Path('probe-public/public.json').write_text(json.dumps({'runId':os.environ['GITHUB_RUN_ID'],'nonce':secrets.token_hex(24),'publicPem':public.decode(),'publicSha256':hashlib.sha256(public).hexdigest()}))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: probe-public-${{ github.run_id }}
          path: probe-public/public.json
          retention-days: 1
      - name: Wait for matching ciphertext and execute two bounded diagnostics
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          python -u - <<'PY'
          import os, json, time, base64, subprocess, urllib.request, urllib.error
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          metadata=json.loads(Path('probe-public/public.json').read_text())
          private=Path(os.environ['RUNNER_TEMP'])/'agbot-probe-private.pem'
          key=serialization.load_pem_private_key(private.read_bytes(),password=None)
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/.ci/live-provider-encrypted.json?ref='+os.environ['GITHUB_REF_NAME']
          deadline=time.monotonic()+900
          try:
              while time.monotonic()<deadline:
                  request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'Accept':'application/vnd.github+json'})
                  try:
                      with urllib.request.urlopen(request,timeout=20) as response:
                          envelope=json.loads(response.read(32768))
                      value=json.loads(base64.b64decode(envelope['content']))
                      if all(value.get(k)==metadata[k] for k in ('runId','nonce','publicSha256')):
                          plaintext=key.decrypt(base64.b64decode(value['ciphertext'],validate=True),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
                          decoded=json.loads(plaintext)
                          if decoded.get('baseUrl')!='https://worldclawpro.ai/v1':raise RuntimeError('Unexpected test target')
                          env=dict(os.environ);env.pop('GH_READ_TOKEN',None)
                          subprocess.run(['node','scripts/live_wire_probe.mjs','live-evidence/result.json'],input=plaintext,env=env,check=True,timeout=240)
                          break
                  except urllib.error.HTTPError as e:
                      if e.code!=404:raise
                  time.sleep(5)
              else:raise RuntimeError('No matching encrypted authorization payload received')
          finally:
              private.unlink(missing_ok=True)
          PY
      - name: Upload whitelist-only live results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-provider-evidence-${{ github.run_id }}
          path: live-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove any remaining disposable key
        if: always()
        run: rm -f "$RUNNER_TEMP/agbot-probe-private.pem"
