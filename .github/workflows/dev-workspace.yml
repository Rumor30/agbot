name: Development source workspace
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/dev-workspace.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact current source without private runtime files
        run: |
          mkdir -p workspace
          git archive --format=tar.gz --prefix=agbot/ HEAD > workspace/agbot-source.tar.gz
          git rev-parse HEAD > workspace/agbot-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: development-source-workspace
          path: workspace/
          retention-days: 7
          if-no-files-found: error
